name: Gallery automation
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync = complete photo artifact only; publish = validate/build/deploy; rollback = restore deployment'
        type: choice
        options: [sync, publish, rollback]
        default: sync
        required: true
      photo_commit:
        description: 'Optional full photo commit SHA; empty resolves main once. Required with photo_run_id.'
        type: string
      photo_run_id:
        description: 'Optional successful sync/publish run ID to reuse its photos artifact (14 days); fingerprint must match.'
        type: string
      deployment_id:
        description: 'Rollback only: successful Cloudflare production deployment UUID'
        type: string
# Serialize complete transactions including rollback. Never cancel an in-flight remote upload.
# Head/version checks also reject superseded runs; GitHub does not guarantee queue ordering.
concurrency:
  group: gallery-production
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  automate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      TASK_MODE: ${{ inputs.mode || 'publish' }}
      AUTO_DEPLOY_ENABLED: ${{ vars.AUTO_DEPLOY_ENABLED || 'false' }}
      PHOTO_COMMIT: ${{ inputs.photo_commit }}
      PHOTO_RUN_ID: ${{ inputs.photo_run_id }}
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Code, Project, Engine, Viewer, Website and automation regression checks
        if: env.TASK_MODE != 'rollback'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:checks
      - name: Resolve immutable photo snapshot
        id: snapshot
        if: env.TASK_MODE != 'rollback'
        env:
          JASON_PHOTOS_READ_TOKEN: ${{ secrets.JASON_PHOTOS_READ_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm automation resolve
      - name: Restore original blobs (independent of processor versions)
        id: blobs
        if: env.TASK_MODE != 'rollback' && env.PHOTO_RUN_ID == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/photo-engine/cache/blobs
          key: photo-blobs-v1-${{ runner.os }}-${{ steps.snapshot.outputs.photo_commit }}
          restore-keys: photo-blobs-v1-${{ runner.os }}-
      - name: Restore derived cache
        id: derived
        if: env.TASK_MODE != 'rollback' && env.PHOTO_RUN_ID == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/photo-engine/cache/state.json
            .cache/photo-engine/cache/metadata
            .cache/photo-engine/cache/thumbnails
          key: photo-derived-v2-${{ runner.os }}-${{ steps.snapshot.outputs.fingerprint }}-${{ steps.snapshot.outputs.photo_commit }}
          restore-keys: |
            photo-derived-v2-${{ runner.os }}-${{ steps.snapshot.outputs.fingerprint }}-
            photo-derived-v2-${{ runner.os }}-
      - name: Download explicitly selected complete photo artifact
        if: env.TASK_MODE != 'rollback' && env.PHOTO_RUN_ID != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: photos
          path: .cache/automation/photos
          run-id: ${{ inputs.photo_run_id }}
          github-token: ${{ github.token }}
      - name: Process or verify complete photos
        id: photos
        if: env.TASK_MODE != 'rollback'
        env:
          JASON_PHOTOS_READ_TOKEN: ${{ secrets.JASON_PHOTOS_READ_TOKEN || github.token }}
        run: pnpm automation photos
      - name: Save verified original blobs
        if: steps.photos.outcome == 'success' && env.PHOTO_RUN_ID == '' && steps.blobs.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/photo-engine/cache/blobs
          key: ${{ steps.blobs.outputs.cache-primary-key }}
      - name: Save verified derived cache
        if: steps.photos.outcome == 'success' && env.PHOTO_RUN_ID == '' && steps.derived.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/photo-engine/cache/state.json
            .cache/photo-engine/cache/metadata
            .cache/photo-engine/cache/thumbnails
          key: ${{ steps.derived.outputs.cache-primary-key }}
      - name: Full index and previews for future administration (never deploy this directory)
        if: steps.photos.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photos
          path: .cache/automation/photos
          retention-days: 14
          if-no-files-found: error
      - name: Validate Projects, build and seal public website
        if: env.TASK_MODE == 'publish'
        run: pnpm automation build
      - name: Audit real metadata projection after photo export
        if: env.TASK_MODE == 'publish'
        run: pnpm test:metadata-real
      - name: Retain complete release for inspection
        if: env.TASK_MODE == 'publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-release
          path: .cache/automation/release
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified release
        if: env.TASK_MODE == 'publish' && (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY_ENABLED == 'true')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm automation deploy
      - name: Roll back successful production deployment
        if: env.TASK_MODE == 'rollback'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: pnpm automation rollback
      - name: Machine-readable execution summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/summary.mjs
      - name: Retain execution summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-summary
          path: .cache/automation/summary.json
          retention-days: 30
          if-no-files-found: warn
